<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Monitor</title>
  <style>
    :root {
      --bg-1: #04111f;
      --bg-2: #0a2236;
      --bg-3: #133e5d;
      --cyan: #62ebff;
      --teal: #1dd5c1;
      --green: #8ef59d;
      --white: #f3fbff;
      --muted: #a7c2d8;
      --glass: rgba(8, 27, 43, 0.62);
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 40px 120px rgba(0, 0, 0, 0.42);
      --status-color: var(--green);
      --status-glow: rgba(142, 245, 157, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 18% 18%, rgba(98, 235, 255, 0.16), transparent 24%),
        radial-gradient(circle at 82% 15%, rgba(142, 245, 157, 0.12), transparent 20%),
        radial-gradient(circle at 50% 120%, rgba(29, 213, 193, 0.14), transparent 36%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    }

    .atmosphere,
    .floor,
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .atmosphere::before,
    .atmosphere::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      mix-blend-mode: screen;
    }

    .atmosphere::before {
      width: 42vw;
      height: 42vw;
      top: -10vw;
      left: -8vw;
      background: radial-gradient(circle, rgba(98, 235, 255, 0.34), rgba(98, 235, 255, 0));
      animation: auraShiftA 18s ease-in-out infinite;
    }

    .atmosphere::after {
      width: 38vw;
      height: 38vw;
      right: -8vw;
      bottom: -10vw;
      background: radial-gradient(circle, rgba(142, 245, 157, 0.24), rgba(142, 245, 157, 0));
      animation: auraShiftB 20s ease-in-out infinite;
    }

    .floor {
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 72px 72px;
      transform: perspective(1300px) rotateX(76deg) translateY(34vh) scale(1.9);
      transform-origin: center top;
      opacity: 0.24;
      mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.85) 34%, rgba(0, 0, 0, 1));
      animation: floorDrift 16s linear infinite;
    }

    .particles span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 12px rgba(98, 235, 255, 0.4);
      animation: particleFloat 10s linear infinite;
    }

    .particles span:nth-child(1) { left: 10%; top: 72%; animation-delay: -1s; }
    .particles span:nth-child(2) { left: 18%; top: 18%; animation-delay: -4s; }
    .particles span:nth-child(3) { left: 34%; top: 82%; animation-delay: -7s; }
    .particles span:nth-child(4) { left: 52%; top: 24%; animation-delay: -3s; }
    .particles span:nth-child(5) { left: 68%; top: 76%; animation-delay: -6s; }
    .particles span:nth-child(6) { left: 84%; top: 20%; animation-delay: -8s; }

    .scene {
      position: relative;
      width: min(92vw, 1240px);
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      position: relative;
      width: min(100%, 1180px);
      overflow: hidden;
      padding: 54px 58px;
      border-radius: 38px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(7, 21, 35, 0.76), var(--glass));
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      animation: cardHover 9s ease-in-out infinite;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(130deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0), rgba(98, 235, 255, 0.16));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: -20% auto -20% -10%;
      width: 46%;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.02) 36%, transparent 62%);
      transform: translateX(-140%) skewX(-14deg);
      animation: sheen 8s ease-in-out infinite;
      pointer-events: none;
    }

    .layout {
      position: relative;
      display: grid;
      grid-template-columns: 300px minmax(520px, 1fr);
      gap: 34px;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .beacon {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto;
    }

    .beacon-bg,
    .halo,
    .ring,
    .sweep,
    .sweep::before,
    .orb-core,
    .orb-reflection,
    .satellite-track,
    .satellite {
      position: absolute;
      inset: 0;
      margin: auto;
      border-radius: 50%;
    }

    .beacon-bg {
      width: 230px;
      height: 230px;
      background:
        radial-gradient(circle, rgba(98, 235, 255, 0.08), transparent 58%),
        radial-gradient(circle, rgba(255, 255, 255, 0.03), transparent 70%);
      box-shadow: inset 0 0 34px rgba(98, 235, 255, 0.12);
    }

    .halo {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(29, 213, 193, 0.16), rgba(29, 213, 193, 0));
      filter: blur(16px);
      animation: haloBreath 4s ease-in-out infinite;
    }

    .ring {
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ring.r1 {
      width: 206px;
      height: 206px;
      animation: ringGlow 4.8s ease-in-out infinite;
    }

    .ring.r2 {
      width: 176px;
      height: 176px;
      border-style: dashed;
      border-color: rgba(255, 255, 255, 0.12);
      animation: slowRotate 18s linear infinite;
    }

    .ring.r3 {
      width: 148px;
      height: 148px;
      border-color: rgba(98, 235, 255, 0.14);
      animation: ringGlow 4.8s ease-in-out infinite reverse;
    }

    .sweep {
      width: 188px;
      height: 188px;
      overflow: hidden;
      mask-image: radial-gradient(circle, transparent 0 26%, #000 27%);
    }

    .sweep::before {
      content: "";
      inset: -18%;
      background: conic-gradient(from 0deg, rgba(98, 235, 255, 0), rgba(98, 235, 255, 0.03), rgba(98, 235, 255, 0.22), rgba(98, 235, 255, 0));
      filter: blur(2px);
      animation: steadySpin 6.8s linear infinite;
    }

    .orb-core {
      width: 102px;
      height: 102px;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.28) 14%, rgba(255, 255, 255, 0) 28%),
        radial-gradient(circle at 40% 40%, #2ce0d2 0%, #1dcac0 48%, #16a6ba 100%);
      box-shadow:
        inset -12px -18px 22px rgba(0, 89, 112, 0.3),
        inset 14px 16px 24px rgba(255, 255, 255, 0.14),
        0 0 30px rgba(98, 235, 255, 0.45),
        0 0 80px rgba(29, 213, 193, 0.2);
      animation: orbFloat 4.8s ease-in-out infinite;
    }

    .orb-reflection {
      width: 24px;
      height: 24px;
      top: -32px;
      left: -26px;
      background: var(--status-color);
      filter: blur(1px);
      box-shadow: 0 0 20px var(--status-glow);
      animation: satelliteBlink 2.6s ease-in-out infinite;
    }

    .satellite-track {
      width: 122px;
      height: 122px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: slowRotateReverse 12s linear infinite;
    }

    .satellite {
      width: 10px;
      height: 10px;
      top: -61px;
      background: var(--status-color);
      box-shadow: 0 0 18px var(--status-glow);
    }

    .content {
      max-width: 660px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      animation: riseIn 700ms ease-out both;
    }

    .status-chip::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--status-color);
      box-shadow: 0 0 18px var(--status-glow);
      animation: satelliteBlink 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(40px, 5.4vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      animation: riseIn 950ms ease-out both;
    }

    .gradient {
      background: linear-gradient(90deg, #ffffff 0%, #c3ffe7 42%, #62ebff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0;
      max-width: 570px;
      font-size: 18px;
      line-height: 1.8;
      color: var(--muted);
      animation: riseIn 1150ms ease-out both;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 24px;
      animation: riseIn 1300ms ease-out both;
    }

    .stat {
      min-width: 150px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7da3bb;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
      word-break: break-word;
    }

    body[data-status="checking"] {
      --status-color: #ffd76f;
      --status-glow: rgba(255, 215, 111, 0.82);
    }

    body[data-status="offline"],
    body[data-status="shutting_down"] {
      --status-color: #ff7c7c;
      --status-glow: rgba(255, 124, 124, 0.82);
    }

    body[data-status="offline"] .card,
    body[data-status="shutting_down"] .card {
      box-shadow: 0 40px 120px rgba(62, 8, 18, 0.38);
    }

    body[data-status="offline"] .gradient,
    body[data-status="shutting_down"] .gradient {
      background: linear-gradient(90deg, #ffffff 0%, #ffc2c2 45%, #ff7c7c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes auraShiftA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(24px, 22px, 0) scale(1.06); }
    }

    @keyframes auraShiftB {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-24px, -18px, 0) scale(1.08); }
    }

    @keyframes floorDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 72px, 72px 0; }
    }

    @keyframes particleFloat {
      0% {
        transform: translate3d(0, 18px, 0) scale(0.85);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      100% {
        transform: translate3d(0, -38px, 0) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes cardHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes sheen {
      0%, 100% {
        transform: translateX(-140%) skewX(-14deg);
        opacity: 0;
      }
      18% {
        opacity: 0.85;
      }
      42% {
        transform: translateX(250%) skewX(-14deg);
        opacity: 0;
      }
    }

    @keyframes haloBreath {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.46;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.9;
      }
    }

    @keyframes ringGlow {
      0%, 100% {
        opacity: 0.42;
        transform: scale(1);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.025);
      }
    }

    @keyframes steadySpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slowRotateReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.03);
      }
    }

    @keyframes satelliteBlink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.36;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 840px) {
      .scene {
        width: min(96vw, 1180px);
        padding: 14px;
      }

      .card {
        padding: 34px 24px;
        border-radius: 30px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
        text-align: center;
        justify-items: center;
      }

      .beacon {
        width: 190px;
        height: 190px;
      }

      .beacon-bg {
        width: 190px;
        height: 190px;
      }

      .ring.r1 {
        width: 172px;
        height: 172px;
      }

      .ring.r2 {
        width: 146px;
        height: 146px;
      }

      .ring.r3 {
        width: 124px;
        height: 124px;
      }

      .sweep {
        width: 158px;
        height: 158px;
      }

      .satellite-track {
        width: 104px;
        height: 104px;
      }

      .satellite {
        top: -52px;
      }

      p {
        margin: 0 auto;
      }

      .stats {
        justify-content: center;
      }
    }
  </style>
</head>
<body data-status="checking">
  <div class="atmosphere"></div>
  <div class="floor"></div>
  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="scene">
    <div class="card">
      <div class="layout">
        <div class="beacon">
          <div class="beacon-bg"></div>
          <div class="halo"></div>
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="sweep"></div>
          <div class="satellite-track">
            <div class="satellite"></div>
          </div>
          <div class="orb-core"></div>
          <div class="orb-reflection"></div>
        </div>

        <div class="content">
          <div class="status-chip">Checking</div>
          <h1><span class="gradient">Server</span> is Running</h1>
          <p id="description">A live health check is in progress to confirm that the backend is reachable and responding correctly.</p>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">Status</div>
              <div class="stat-value" id="statusValue">Verifying</div>
            </div>
            <div class="stat">
              <div class="stat-label">Backend Origin</div>
              <div class="stat-value" id="serverUrl">Connecting</div>
            </div>
            <div class="stat">
              <div class="stat-label">Last Check</div>
              <div class="stat-value" id="lastCheck">Pending</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const body = document.body;
    const serverUrlEl = document.getElementById("serverUrl");
    const statusValueEl = document.getElementById("statusValue");
    const lastCheckEl = document.getElementById("lastCheck");
    const statusChipEl = document.querySelector(".status-chip");
    const titleGradientEl = document.querySelector(".gradient");
    const descriptionEl = document.getElementById("description");
    const healthUrl = `${window.location.origin}/status/health`;

    function formatTime(value) {
      return new Date(value).toLocaleTimeString('en-IN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function applyStatus(status, payload) {
      body.dataset.status = status;

      if (payload && payload.backend_origin) {
        serverUrlEl.textContent = payload.backend_origin;
      }

      if (status === 'online') {
        statusChipEl.textContent = 'System Live';
        statusValueEl.textContent = 'Operational';
        titleGradientEl.textContent = 'Server';
        descriptionEl.textContent = 'Your backend is online, reachable, and ready to handle requests with stable performance and real-time availability.';
      } else if (status === 'shutting_down') {
        statusChipEl.textContent = 'Shutdown Mode';
        statusValueEl.textContent = 'Shutting Down';
        titleGradientEl.textContent = 'Server';
        descriptionEl.textContent = 'Your backend is responding, but it is currently entering shutdown mode and may stop accepting requests shortly.';
      } else if (status === 'checking') {
        statusChipEl.textContent = 'Checking';
        statusValueEl.textContent = 'Verifying';
        titleGradientEl.textContent = 'Server';
        descriptionEl.textContent = 'A live health check is in progress to confirm that the backend is reachable and responding correctly.';
      } else {
        statusChipEl.textContent = 'Connection Lost';
        statusValueEl.textContent = 'Unavailable';
        titleGradientEl.textContent = 'Server';
        descriptionEl.textContent = 'The monitor is running, but the backend health endpoint could not be reached. Please verify the server process and try again.';
      }

      if (payload && payload.checked_at) {
        lastCheckEl.textContent = formatTime(payload.checked_at);
      } else {
        lastCheckEl.textContent = 'Failed';
      }
    }

    async function runHealthCheck() {
      applyStatus('checking');

      try {
        const response = await fetch(healthUrl, {
          method: 'GET',
          cache: 'no-store'
        });

        const payload = await response.json();
        applyStatus(payload.status || (response.ok ? 'online' : 'offline'), payload);
      } catch (error) {
        applyStatus('offline');
      }
    }

    runHealthCheck();
    setInterval(runHealthCheck, 5000);
  </script>
</body>
</html>
