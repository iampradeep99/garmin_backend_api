<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garmin Backend API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root {
      --navy: #0d2b45;
      --blue: #1769d1;
      --sky: #49a5ff;
      --sand: #f3efe6;
      --ink: #142433;
      --mint: #ddfff2;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 40px rgba(13, 43, 69, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(73, 165, 255, 0.28), transparent 28%),
        radial-gradient(circle at top right, rgba(23, 105, 209, 0.18), transparent 22%),
        linear-gradient(145deg, #eef5fb 0%, #f7f2ea 100%);
      font-family: "Segoe UI", sans-serif;
    }
    .hero-wrap {
      padding: 28px 20px 10px;
    }
    .hero {
      max-width: 1380px;
      margin: 0 auto;
      padding: 28px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      background:
        radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.24), transparent 20%),
        linear-gradient(120deg, var(--navy) 0%, var(--blue) 55%, var(--sky) 100%);
      box-shadow: 0 20px 48px rgba(13, 43, 69, 0.22);
      overflow: hidden;
      position: relative;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -35% auto;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(10px);
      pointer-events: none;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hero p {
      max-width: 760px;
      margin: 10px 0 0;
      opacity: 0.92;
      font-size: 15px;
      line-height: 1.6;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }
    .hero-badge {
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
    }
    #swagger-ui {
      max-width: 1400px;
      margin: 12px auto 0;
      padding: 0 16px 40px;
    }
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-ui .scheme-container,
    .swagger-ui .servers,
    .swagger-ui .servers-title,
    .swagger-ui .information-container .base-url,
    .swagger-ui .request-url,
    .swagger-ui .copy-to-clipboard {
      display: none !important;
    }
    .swagger-ui .information-container {
      padding: 0 6px 18px;
    }
    .swagger-ui .info {
      margin: 0 0 18px;
    }
    .swagger-ui .info .title {
      color: var(--navy);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .swagger-ui .wrapper {
      max-width: 100%;
    }
    .swagger-ui .opblock {
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      box-shadow: var(--shadow);
      background: var(--card);
      backdrop-filter: blur(12px);
      margin-bottom: 18px;
    }
    .swagger-ui .opblock .opblock-summary {
      border-bottom: 0;
      align-items: center;
      padding: 8px 0;
    }
    .swagger-ui .opblock-tag {
      margin: 28px 0 12px;
      padding: 12px 16px;
      color: var(--navy);
      border-bottom: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 10px 24px rgba(13, 43, 69, 0.08);
    }
    .swagger-ui .opblock-tag small {
      color: #53657a;
    }
    .swagger-ui .opblock-tag:hover {
      background: rgba(255, 255, 255, 0.88);
    }
    .swagger-ui .opblock .opblock-summary-path {
      color: var(--ink);
      font-weight: 700;
    }
    .swagger-ui .opblock .opblock-summary-description {
      color: #4f6275;
      font-weight: 500;
    }
    .swagger-ui .btn.authorize {
      border-color: rgba(23, 105, 209, 0.2);
      color: var(--navy);
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(23, 105, 209, 0.12);
    }
    .swagger-ui .btn.execute {
      border-radius: 999px;
      border-color: transparent;
      background: linear-gradient(120deg, var(--navy), var(--blue));
    }
    .swagger-ui .model-box,
    .swagger-ui .responses-inner,
    .swagger-ui .opblock-section-header,
    .swagger-ui .tab li button.tablinks {
      border-radius: 14px;
    }
    .swagger-ui section.models {
      margin-top: 24px;
      border: 0;
      border-radius: 24px;
      box-shadow: var(--shadow);
      background: var(--card);
      overflow: hidden;
    }
    .swagger-ui .responses-table .response-col_status {
      font-weight: 700;
    }
    .swagger-ui .markdown p,
    .swagger-ui .renderedMarkdown p {
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .hero {
        padding: 22px 20px;
        border-radius: 22px;
      }
      .hero-meta {
        gap: 10px;
      }
      #swagger-ui {
        padding: 0 10px 28px;
      }
      .swagger-ui .info .title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="hero-wrap">
    <div class="hero">
      <h1>Garmin Backend API Documentation</h1>
      <p>Interactive API reference for authentication, Garmin integrations, thresholds, and webhook flows with an event-driven alert pipeline and a cleaner, dashboard-style experience.</p>
      <div class="hero-meta">
        <span class="hero-badge">JWT Protected APIs</span>
        <span class="hero-badge">Push + Ping Webhooks</span>
        <span class="hero-badge">Event-Driven Alerts</span>
        <span class="hero-badge">Try It Out Enabled</span>
      </div>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/api-docs.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
      defaultModelsExpandDepth: 2,
      docExpansion: 'list',
      persistAuthorization: true
    });
  </script>
</body>
</html>
